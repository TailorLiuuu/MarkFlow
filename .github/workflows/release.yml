name: Windows Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Match release tag to application version
        shell: python
        run: |
          import os, re
          from pathlib import Path
          version = re.search(r"^VERSION=['\"]([^'\"]+)", Path('desktop/agent_runtime.py').read_text(), re.M)[1]
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and application version differ'
      - run: python scripts/privacy_check.py
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean desktop/MarkFlow.spec
      - run: python scripts/package_release.py
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --draft --title "MarkFlow $env:GITHUB_REF_NAME" --generate-notes
